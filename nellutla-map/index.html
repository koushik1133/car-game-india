<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nellutla Map Test Drive</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9cc3df; font-family: -apple-system, system-ui, sans-serif; }
  canvas#gl { display: block; }
  #hud { position: fixed; left: 12px; top: 12px; color: #fff; background: rgba(10,15,25,.72); padding: 10px 14px; border-radius: 10px; font-size: 13px; line-height: 1.5; max-width: 330px; }
  #hud b { color: #ffd36b; }
  #radar { position: fixed; right: 14px; bottom: 14px; width: 220px; height: 220px; border-radius: 50%; border: 3px solid rgba(255,255,255,.7); background: #223; }
  #bigmap { position: fixed; left: 4vw; top: 4vh; width: 92vw; height: 92vh; display: none; background: rgba(8,12,20,.92); border-radius: 12px; }
  #speed { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); color: #fff; font-size: 34px; font-weight: 800; text-shadow: 0 2px 6px #000; }
  #speed small { font-size: 14px; display: block; text-align: center; color: #cfd8dc; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud">
  <b>Nellutla, Jangaon district, Telangana</b><br>
  W/A/S/D or arrows: drive &middot; Space: handbrake<br>
  C: camera (chase / high / drone) &middot; M: full map<br>
  1-9: teleport to landmarks &middot; R: reset<br>
  <span id="where"></span>
</div>
<div id="speed">0<small>km/h &middot; <span id="surf">-</span></small></div>
<canvas id="radar" width="220" height="220"></canvas>
<canvas id="bigmap"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="map-data.js"></script>
<script src="nellutla-world.js"></script>
<script>
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xa9cbe3);
scene.fog = new THREE.Fog(0xbfd2dc, 300, 1900);
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.2, 6000);
scene.add(new THREE.HemisphereLight(0xfff4e0, 0x7a6040, 0.85));
const sun = new THREE.DirectionalLight(0xfff1d6, 1.0);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -90, right: 90, top: 90, bottom: -90, near: 10, far: 500 });
scene.add(sun); scene.add(sun.target);

const world = NellutlaWorld.build(scene, window.NELLUTLA_MAP);

// simple test vehicle (placeholder until a game car is plugged in)
const car = new THREE.Group();
const body = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.9, 4.6), new THREE.MeshLambertMaterial({ color: 0xf5f5f5 }));
body.position.y = 0.85; body.castShadow = true; car.add(body);
const cab = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.75, 2.6), new THREE.MeshLambertMaterial({ color: 0x1c2733 }));
cab.position.set(0, 1.65, -0.3); car.add(cab);
for (const [x, z] of [[-0.9,1.45],[0.9,1.45],[-0.9,-1.45],[0.9,-1.45]]) {
  const w = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.38, 0.28, 14), new THREE.MeshLambertMaterial({ color: 0x111111 }));
  w.rotation.z = Math.PI / 2; w.position.set(x, 0.38, z); car.add(w);
}
scene.add(car);

const st = { x: world.spawn.x, z: world.spawn.z, rot: 0, v: 0, steer: 0 };
// face along the highway at spawn
(function () {
  let best = null;
  for (const r of world.roads) if (r.t === 'highway') for (let i = 0; i < r.p.length - 1; i++) {
    const d = Math.hypot(r.p[i][0] - st.x, r.p[i][1] - st.z);
    if (!best || d < best.d) best = { d, a: r.p[i], b: r.p[i+1] };
  }
  if (best) st.rot = Math.atan2(best.b[0] - best.a[0], best.b[1] - best.a[1]);
})();
const spawn = { ...st };
const keys = {};
let camMode = 0, showMap = false;
const GRIP = { highway: 1, tar: 1, cc: 0.97, lane: 0.93, dirt: 0.85, river: 0.7, field: 0.75 };
const TOP = { highway: 160, tar: 120, cc: 70, lane: 55, dirt: 70, river: 45, field: 55 };
const marks = world.landmarks.filter(l => l.k !== 'anganwadi').slice(0, 9);

addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyC') camMode = (camMode + 1) % 3;
  if (e.code === 'KeyM') { showMap = !showMap; document.getElementById('bigmap').style.display = showMap ? 'block' : 'none'; }
  if (e.code === 'KeyR') Object.assign(st, spawn);
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= marks.length) { st.x = marks[n-1].x + 12; st.z = marks[n-1].z + 12; st.v = 0; }
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

const camPos = new THREE.Vector3(st.x, 8, st.z + 12);
const clock = new THREE.Clock();
function step(dt) {
  const surf = world.surfaceAt(st.x, st.z), grip = GRIP[surf];
  const gas = keys.KeyW || keys.ArrowUp, brk = keys.KeyS || keys.ArrowDown;
  const left = keys.KeyA || keys.ArrowLeft, right = keys.KeyD || keys.ArrowRight;
  st.steer += (((left ? 1 : 0) - (right ? 1 : 0)) - st.steer) * Math.min(1, dt * 8);
  if (gas) st.v += 9 * grip * dt;
  if (brk) st.v -= (st.v > 0 ? 18 : 6) * dt;
  if (keys.Space) st.v *= 1 - dt * 2.5;
  st.v *= 1 - dt * (0.12 + (1 - grip) * 0.6);
  st.v = Math.max(-8, Math.min(TOP[surf] / 3.6, st.v));
  st.rot += st.steer * Math.min(1, Math.abs(st.v) / 6) * Math.sign(st.v) * dt * 1.9 * (keys.Space ? 1.6 : 1);
  st.x += Math.sin(st.rot) * st.v * dt; st.z += Math.cos(st.rot) * st.v * dt;
  const [x0, z0, x1, z1] = world.bounds;
  st.x = Math.max(x0 + 5, Math.min(x1 - 5, st.x)); st.z = Math.max(z0 + 5, Math.min(z1 - 5, st.z));
  const c = world.collide(st, 1.6);
  if (c.hit) st.v *= 0.6;
  car.position.set(st.x, 0, st.z); car.rotation.y = st.rot;
  document.getElementById('speed').firstChild.nodeValue = Math.round(Math.abs(st.v) * 3.6);
  document.getElementById('surf').textContent = surf;
}

function updateCamera(dt) {
  const fx = Math.sin(st.rot), fz = Math.cos(st.rot);
  const cfg = [[9, 3.6], [22, 14], [70, 120]][camMode];
  const target = new THREE.Vector3(st.x - fx * cfg[0], cfg[1], st.z - fz * cfg[0]);
  camPos.lerp(target, Math.min(1, dt * 4));
  camera.position.copy(camPos);
  camera.lookAt(st.x + fx * 4, 1.2, st.z + fz * 4);
  sun.position.set(st.x + 120, 220, st.z + 80); sun.target.position.set(st.x, 0, st.z);
}

function nearestLandmark() {
  let b = null;
  for (const l of world.landmarks) { const d = Math.hypot(l.x - st.x, l.z - st.z); if (!b || d < b.d) b = { d, l }; }
  return b ? `Near: <b>${b.l.name}</b> (${Math.round(b.d)} m)` : '';
}

const radar = document.getElementById('radar').getContext('2d');
const big = document.getElementById('bigmap');
function drawRadar() {
  radar.clearRect(0, 0, 220, 220);
  radar.save(); radar.beginPath(); radar.arc(110, 110, 110, 0, Math.PI * 2); radar.clip();
  world.drawMap(radar, st.x, st.z, 0.9, 220, 220, Math.PI + st.rot);
  radar.fillStyle = '#38bdf8'; radar.beginPath(); radar.moveTo(110, 100); radar.lineTo(117, 118); radar.lineTo(103, 118); radar.fill();
  radar.restore();
}
function drawBigMap() {
  big.width = big.clientWidth; big.height = big.clientHeight;
  const g = big.getContext('2d'), [x0, z0, x1, z1] = world.bounds;
  const s = Math.min(big.width / (x1 - x0), big.height / (z1 - z0));
  world.drawMap(g, (x0 + x1) / 2, (z0 + z1) / 2, s, big.width, big.height, 0);
  const P = (x, z) => [big.width / 2 + (x - (x0 + x1) / 2) * s, big.height / 2 + (z - (z0 + z1) / 2) * s];
  g.font = '12px sans-serif'; g.textAlign = 'left';
  world.landmarks.forEach(l => { const [px, py] = P(l.x, l.z); g.fillStyle = '#ffd36b'; g.beginPath(); g.arc(px, py, 4, 0, 7); g.fill(); g.fillStyle = '#fff'; g.fillText(l.name, px + 6, py + 4); });
  const [cx, cy] = P(st.x, st.z); g.fillStyle = '#38bdf8'; g.beginPath(); g.arc(cx, cy, 6, 0, 7); g.fill();
  g.fillStyle = '#fff'; g.font = 'bold 14px sans-serif'; g.fillText('N ↑   1 km ≈ ' + Math.round(1000 * s) + ' px', 14, 22);
}

let hudT = 0;
(function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, clock.getDelta());
  step(dt); updateCamera(dt); world.update(camera);
  drawRadar(); if (showMap) drawBigMap();
  if ((hudT += dt) > 0.4) { hudT = 0; document.getElementById('where').innerHTML = nearestLandmark(); }
  renderer.render(scene, camera);
})();
window.__nellutla = { world, st };
</script>
</body>
</html>
